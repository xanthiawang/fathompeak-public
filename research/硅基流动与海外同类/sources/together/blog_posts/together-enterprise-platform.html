  /* === Line Numbers === */
  pre[class*='language-'].line-numbers {
    position: relative;
    padding-left: 3.8em;
    counter-reset: linenumber;
    overflow: hidden;
    line-height: 1.5;
  }

  pre[class*='language-'].line-numbers > code {
    position: relative;
    white-space: inherit;
  }

  pre.line-numbers .line-numbers-rows {
    position: absolute;
    pointer-events: none;
    top: 0.1em;
    font-size: 100%;
    left: -3.8em;
    width: 3em;
    letter-spacing: -1px;
    border: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  pre .line-numbers-rows > span {
    display: block;
    counter-increment: linenumber;
    height: 1.5em;
  }

  pre .line-numbers-rows > span:before {
    content: counter(linenumber);
    color: #626b84;
    display: block;
    padding-right: 0.8em;
    text-align: right;
    line-height: 1em;
  }

  /* === Dark Palette (default) === */
  .token.cdata,

    color: #b9b5b8;
  }

  .token.boolean,

  .token.number,

  }

  .token.property {

  }

  .token.tag {
    color: #1290bf;
  }

  .token.string,
  .token.entity,
  .token.url {
    color: #fc92e3;
  }

  .token.selector {

  }

  .token.attr-name {

    const isStaging = window.location.origin.includes('webflow.io');
    const isLocal = localStorage.getItem('isStagingForMe') === 'true' 
    const version = isStaging ? "2.3.7" : "2.3.7";

    function loadScript(src) {
      const script = document.createElement('script');
      script.src = src;
      script.defer = true;
      document.body.appendChild(script);
    }

    const basePath = isLocal ? 'http://localhost:3000/' : repository + version + '/dist/';

    // Load on All
    loadScript(basePath + 'index.js');

    // Expose a global function to load page-specific scripts
    window.loadPageScript = function(pageScriptName, customVersion) {
      const scriptVersion = version;
      const scriptSrc = isLocal
      ? `http://localhost:3000/${pageScriptName}`
      : `${repository}${scriptVersion}/dist/${pageScriptName}`;

      loadScript(scriptSrc);
    };
  })();
