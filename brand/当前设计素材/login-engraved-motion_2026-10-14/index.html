<style>
:root{--sans:"DM Sans","PingFang SC",sans-serif;--serif:"Fraunces","Songti SC",serif;--r24:16px}
*{box-sizing:border-box}body{margin:0;background:#F3F1EA;color:#212021;font-family:var(--sans)}
.ac{display:grid;grid-template-columns:minmax(0,min(48%,calc((100svh - 24px)*.666667))) minmax(0,1fr);min-height:100svh;padding:12px;max-width:1680px;margin:auto}
.ac-art{position:relative;isolation:isolate;align-self:start;aspect-ratio:2/3;border-radius:var(--r24);overflow:hidden;background:#DCE7F7;color:#212021}
.ac-engraving{display:block;width:100%;height:auto;aspect-ratio:2/3;user-select:none}
.ac-engraving-effects{position:absolute;inset:0;pointer-events:none}
.ac-wind{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.ac-wind-field{opacity:.36}
.ac-ribbon,.ac-spark,.ac-ink-trace,.ac-tether{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ac-ribbon{stroke:var(--flow-color);stroke-width:1.7;stroke-dasharray:280 140}
.ac-spark{stroke:#2F63B8;stroke-width:3.5;stroke-dasharray:320 1280;opacity:0}
.ac-ink-trace{stroke:var(--flow-color);stroke-width:2.2}
.ac-tether{stroke:#4E3F66;stroke-width:2}
.ac-ink-light{position:absolute;left:29%;top:33%;width:74%;height:48%;opacity:0;background:radial-gradient(ellipse at 58% 47%,rgba(82,132,215,.24),rgba(232,212,204,.12) 32%,transparent 67%);mix-blend-mode:multiply;pointer-events:none}
.ac-touch{position:absolute;left:43%;top:47%;width:34%;height:29%;border:0;background:transparent;border-radius:48%;color:#3D314F;cursor:grab;padding:0;touch-action:none;-webkit-user-select:none;user-select:none}
.ac-touch span{position:absolute;left:95%;top:55%;width:76px;text-align:left;font:500 12px/1.55 var(--sans);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .3s;pointer-events:none}
.ac-touch:hover span,.ac-touch:focus-visible span,.ac-art[data-gripping="true"] .ac-touch span{opacity:1;transform:translateY(0)}
.ac-art[data-gripping="true"],.ac-art[data-gripping="true"] .ac-touch{cursor:grabbing}
.ac-touch:focus-visible{outline:1px dashed #4E3F66;outline-offset:5px}
.ac-art[data-input="pointer"] .ac-touch:focus{outline:none}
.ac-art [hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.ac-engraving-effects,.ac-touch{display:none!important}}

.review{min-height:100svh;display:grid;grid-template-columns:minmax(0,auto) 250px;gap:64px;align-items:center;justify-content:center;padding:32px}
.review .ac-art{width:min(54vw,calc((100svh - 64px)*.666667));border-radius:8px}
.review aside{max-width:250px}.brand{font:400 24px var(--serif);margin:0 0 48px}
h1{font:400 36px/1.25 var(--serif);margin:0 0 20px}
p{font-size:14px;line-height:1.8;color:#625B6B;margin:0 0 24px}
ul{list-style:none;padding:0;margin:0 0 36px;border-top:1px solid #D7D2D6}
li{padding:14px 0;border-bottom:1px solid #D7D2D6;font-size:13px;line-height:1.6}
li span{display:block;color:#706778;font-size:12px}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px;font-size:13px}
a:focus-visible{outline:2px solid #4E3F66;outline-offset:5px}
.links{display:flex;gap:24px;flex-wrap:wrap}.foot{font-size:13px;margin-top:32px;color:#625B6B}
@media(max-width:700px){.review{display:flex;flex-direction:column;gap:28px;padding:16px;align-items:center}.review .ac-art{width:min(100%,480px)}.review aside{max-width:480px;width:100%;padding:8px}.brand{margin-bottom:28px}h1{font-size:30px}}
</style></head>
