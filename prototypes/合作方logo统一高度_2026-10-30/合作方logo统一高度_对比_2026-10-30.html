<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合作方 Logo 统一高度对比</title>
<style>
:root{--ink:#1d1b20;--line:rgba(61,49,90,.08)}
body{margin:0;background:#F9F8F5;color:var(--ink);font-family:-apple-system,"PingFang SC",system-ui,sans-serif;padding:40px 0 80px}
h1{font:500 20px/1.4 inherit;margin:0 48px 6px} p.note{margin:0 48px 28px;color:#777;font-size:13px}
h2{font:500 13px/1.4 inherit;color:#666;margin:28px 48px 8px;letter-spacing:.04em}
.marq{overflow-x:auto;padding:18px 48px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:64px;width:max-content}
.tr img{display:block;filter:grayscale(1) contrast(1.1);opacity:.7}
.mq-t{display:block;font-family:"Songti SC",serif;font-weight:500;letter-spacing:.06em;opacity:.62;white-space:nowrap}
.tr img:hover{opacity:1}
</style></head><body>
<h1>首页合作方 Logo · 统一高度对比</h1><p class="note">所有 logo 已去白底、裁掉留白；同一行内高度完全一致。仅本地预览，未上线。横向可滚动。</p>
<section><h2>A · 全部 24px</h2><div class="marq"><div class="tr"><img src="logos/stategrid.png" alt="stategrid" style="height:24px"><img src="logos/tianjin-energy.png" alt="tianjin-energy" style="height:24px"><img src="logos/starcharge.png" alt="starcharge" style="height:24px"><span class="mq-t" style="font-size:17px;line-height:24px;height:24px">万帮数字能源</span><img src="logos/boe.png" alt="boe" style="height:24px"><img src="logos/cgn.png" alt="cgn" style="height:24px"><img src="logos/shenzhen-gas.png" alt="shenzhen-gas" style="height:24px"><img src="logos/ascend-cann.png" alt="ascend-cann" style="height:24px"><img src="logos/nvidia-inception.png" alt="nvidia-inception" style="height:24px"><img src="logos/soul.png" alt="soul" style="height:24px"></div></div></section>
<section><h2>B · 全部 26px（推荐，和原来的 logo 带同高）</h2><div class="marq"><div class="tr"><img src="logos/stategrid.png" alt="stategrid" style="height:26px"><img src="logos/tianjin-energy.png" alt="tianjin-energy" style="height:26px"><img src="logos/starcharge.png" alt="starcharge" style="height:26px"><span class="mq-t" style="font-size:18px;line-height:26px;height:26px">万帮数字能源</span><img src="logos/boe.png" alt="boe" style="height:26px"><img src="logos/cgn.png" alt="cgn" style="height:26px"><img src="logos/shenzhen-gas.png" alt="shenzhen-gas" style="height:26px"><img src="logos/ascend-cann.png" alt="ascend-cann" style="height:26px"><img src="logos/nvidia-inception.png" alt="nvidia-inception" style="height:26px"><img src="logos/soul.png" alt="soul" style="height:26px"></div></div></section>
<section><h2>C · 全部 28px</h2><div class="marq"><div class="tr"><img src="logos/stategrid.png" alt="stategrid" style="height:28px"><img src="logos/tianjin-energy.png" alt="tianjin-energy" style="height:28px"><img src="logos/starcharge.png" alt="starcharge" style="height:28px"><span class="mq-t" style="font-size:20px;line-height:28px;height:28px">万帮数字能源</span><img src="logos/boe.png" alt="boe" style="height:28px"><img src="logos/cgn.png" alt="cgn" style="height:28px"><img src="logos/shenzhen-gas.png" alt="shenzhen-gas" style="height:28px"><img src="logos/ascend-cann.png" alt="ascend-cann" style="height:28px"><img src="logos/nvidia-inception.png" alt="nvidia-inception" style="height:28px"><img src="logos/soul.png" alt="soul" style="height:28px"></div></div></section>
<section><h2>对照 · 现在线上的按长宽比高度</h2><div class="marq"><div class="tr"><img src="logos/stategrid.png" alt="stategrid" style="height:29px"><img src="logos/tianjin-energy.png" alt="tianjin-energy" style="height:21px"><img src="logos/starcharge.png" alt="starcharge" style="height:23px"><span class="mq-t" style="font-size:18px;line-height:26px;height:26px">万帮数字能源</span><img src="logos/boe.png" alt="boe" style="height:31px"><img src="logos/cgn.png" alt="cgn" style="height:22px"><img src="logos/shenzhen-gas.png" alt="shenzhen-gas" style="height:28px"><img src="logos/ascend-cann.png" alt="ascend-cann" style="height:21px"><img src="logos/nvidia-inception.png" alt="nvidia-inception" style="height:31px"><img src="logos/soul.png" alt="soul" style="height:29px"></div></div></section>
</body></html>
